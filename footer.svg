<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060607"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(200,255,77,0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="f-rounded"><rect width="900" height="150" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#f-rounded)">
    <rect width="900" height="150" fill="url(#f-bg)"/>
    <rect width="900" height="150" fill="url(#f-glow)"/>
    <rect width="900" height="150" rx="14" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

    <!-- Left side -->
    <text x="36" y="34" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2">
      // OPEN CHANNEL
    </text>
    <text x="36" y="68" fill="#f4f4ef" font-family="'Clash Display','Segoe UI',sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5">
      Let's build <tspan fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1">something.</tspan>
    </text>
    <text x="36" y="94" fill="#c8ff4d" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1">
      ✉ aayush@aayushsrivastava.com
    </text>

    <!-- Right side buttons -->
    <g transform="translate(410, 42)">
      <!-- Website button -->
      <rect x="0" y="0" width="158" height="36" rx="18" fill="#c8ff4d"/>
      <text x="79" y="23" fill="#060607" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">
        WEBSITE ↗
      </text>

      <!-- Email button -->
      <rect x="168" y="0" width="112" height="36" rx="18" fill="rgba(200,255,77,0.08)" stroke="rgba(200,255,77,0.3)" stroke-width="0.8"/>
      <text x="224" y="23" fill="#c8ff4d" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">
        EMAIL ↗
      </text>

      <!-- Discord button -->
      <rect x="290" y="0" width="102" height="36" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <text x="341" y="23" fill="#f4f4ef" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">
        DISCORD ↗
      </text>

      <!-- GitHub button -->
      <rect x="402" y="0" width="82" height="36" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <text x="443" y="23" fill="#a0a0a8" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">
        GITHUB ↗
      </text>
    </g>

    <!-- Bottom sub bar -->
    <line x1="36" y1="114" x2="864" y2="114" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="36" y="133" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1.5">
      © 2026 AAYUSH SRIVASTAVA · aayush@aayushsrivastava.com · INDIA (IN)
    </text>
    <text x="864" y="133" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1.2" text-anchor="end">
      STATUS: BUILDING DAILY
    </text>
  </g>
</svg>
