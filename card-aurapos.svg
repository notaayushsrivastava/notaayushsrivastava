<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
  <defs>
    <linearGradient id="bg-ap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow-ap1" cx="8%" cy="0%" r="40%">
      <stop offset="0%" stop-color="rgba(247,37,133,0.09)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow-ap2" cx="100%" cy="100%" r="45%">
      <stop offset="0%" stop-color="rgba(0,245,212,0.07)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="grad-ap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="55%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <clipPath id="rounded-ap"><rect width="420" height="200" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#rounded-ap)">
    <rect width="420" height="200" fill="url(#bg-ap)"/>
    <rect width="420" height="200" fill="url(#glow-ap1)"/>
    <rect width="420" height="200" fill="url(#glow-ap2)"/>
    <rect width="420" height="200" rx="14" fill="none" stroke="rgba(0,245,212,0.22)" stroke-width="1"/>

    <!-- Top -->
    <text x="20" y="28" fill="#82828e" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="2">EXP-08 // IN BETA</text>
    
    <!-- Badge -->
    <rect x="340" y="12" width="60" height="22" rx="11" fill="rgba(12,12,18,0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <circle cx="354" cy="23" r="3" fill="#f72585"/>
    <text x="362" y="27" fill="#d6d6dd" font-family="'Plus Jakarta Sans',sans-serif" font-size="8" font-weight="800" letter-spacing="1.5">BETA</text>

    <!-- Title -->
    <text x="20" y="74" fill="#f4f4ef" font-family="'Plus Jakarta Sans',sans-serif" font-size="26" font-weight="800">AuraPOS </text>
    <text x="143" y="74" fill="url(#grad-ap)" font-family="'Plus Jakarta Sans',sans-serif" font-size="26" font-weight="800">3.0</text>
    
    <!-- Description -->
    <text x="20" y="102" fill="#a8a8b3" font-family="'General Sans',sans-serif" font-size="12">High-speed salon billing &amp; studio management.</text>
    <text x="20" y="118" fill="#a8a8b3" font-family="'General Sans',sans-serif" font-size="12">GST invoicing, commission math, online scheduling.</text>

    <!-- Tags -->
    <rect x="20" y="140" width="58" height="24" rx="12" fill="rgba(5,5,8,0.5)" stroke="rgba(0,245,212,0.2)" stroke-width="0.8"/>
    <text x="30" y="156" fill="#a8a8b3" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="0.8">PYTHON</text>
    
    <rect x="86" y="140" width="48" height="24" rx="12" fill="rgba(5,5,8,0.5)" stroke="rgba(0,245,212,0.2)" stroke-width="0.8"/>
    <text x="96" y="156" fill="#a8a8b3" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="0.8">FLASK</text>
    
    <rect x="142" y="140" width="40" height="24" rx="12" fill="rgba(5,5,8,0.5)" stroke="rgba(0,245,212,0.2)" stroke-width="0.8"/>
    <text x="152" y="156" fill="#a8a8b3" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="0.8">POS</text>
    
    <rect x="190" y="140" width="40" height="24" rx="12" fill="rgba(5,5,8,0.5)" stroke="rgba(0,245,212,0.2)" stroke-width="0.8"/>
    <text x="200" y="156" fill="#a8a8b3" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="0.8">OPS</text>

    <!-- CTA button -->
    <rect x="20" y="174" width="100" height="20" rx="10" fill="url(#grad-ap)"/>
    <text x="40" y="188" fill="#ffffff" font-family="'Plus Jakarta Sans',sans-serif" font-size="9" font-weight="800" letter-spacing="1">IN BETA</text>
  </g>
</svg>
