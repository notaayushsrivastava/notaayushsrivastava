<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060607"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="35%" r="55%">
      <stop offset="0%" stop-color="rgba(200,255,77,0.07)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="rgba(157,255,176,0.04)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="900" height="360" rx="16"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="900" height="360" fill="url(#bg)"/>
    <rect width="900" height="360" fill="url(#grid)"/>
    <rect width="900" height="360" fill="url(#glow)"/>
    <rect width="900" height="360" fill="url(#glow2)"/>
    <rect width="900" height="360" rx="16" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

    <!-- NAVIGATION BAR (matches aayushsrivastava.com navbar) -->
    <g transform="translate(36, 16)">
      <!-- Logo Mark -->
      <rect x="0" y="2" width="22" height="22" rx="6" fill="none" stroke="rgba(200,255,77,0.4)" stroke-width="1"/>
      <text x="11" y="17" fill="#c8ff4d" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" text-anchor="middle">AS</text>
      
      <!-- Brand Name -->
      <text x="32" y="17" fill="#f4f4ef" font-family="'Clash Display','Segoe UI',sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
        aayushsrivastava.com
      </text>

      <!-- Nav Links -->
      <text x="440" y="17" fill="#a0a0a8" font-family="'JetBrains Mono',monospace" font-size="10.5" letter-spacing="2" text-anchor="middle" xml:space="preserve">ABOUT      PROJECTS      CHANGELOG      CONTACT</text>

      <!-- Online Status Pill -->
      <rect x="712" y="0" width="116" height="26" rx="13" fill="rgba(200,255,77,0.08)" stroke="rgba(200,255,77,0.25)" stroke-width="1"/>
      <circle cx="728" cy="13" r="3.5" fill="#c8ff4d"/>
      <text x="738" y="17" fill="#c8ff4d" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.5" font-weight="700">
        ONLINE
      </text>
    </g>

    <!-- Nav border line -->
    <line x1="0" y1="56" x2="900" y2="56" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- HERO SECTION -->
    <!-- Eyebrow label -->
    <text x="36" y="88" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2.5">
      PORTFOLIO — EST. 2008 // TRANSMISSION 002
    </text>
    <line x1="36" y1="96" x2="150" y2="96" stroke="#c8ff4d" stroke-width="1.2" opacity="0.7"/>

    <!-- Hero Title: Solid + Outline -->
    <text x="36" y="160" fill="#f4f4ef" font-family="'Clash Display','Segoe UI',system-ui,sans-serif" font-size="54" font-weight="600" letter-spacing="-1">
      Aayush
    </text>
    <text x="36" y="214" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" font-family="'Clash Display','Segoe UI',system-ui,sans-serif" font-size="54" font-weight="600" letter-spacing="-1">
      Srivastava
    </text>

    <!-- Subtitle Role -->
    <text x="38" y="250" fill="#a0a0a8" font-family="'General Sans','Segoe UI',sans-serif" font-size="15" font-style="italic">
      Programmer
    </text>
    <text x="142" y="250" fill="#63636b" font-family="'General Sans',sans-serif" font-size="15">
      ×
    </text>
    <text x="160" y="250" fill="#a0a0a8" font-family="'General Sans',sans-serif" font-size="15" font-style="italic">
      Designer
    </text>
    <text x="246" y="250" fill="#63636b" font-family="'General Sans',sans-serif" font-size="14.5">
      — building things that live on the internet.
    </text>

    <!-- Hero CTA buttons -->
    <g transform="translate(620, 170)">
      <!-- View Projects button -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#c8ff4d"/>
      <text x="70" y="21" fill="#060607" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" letter-spacing="1" text-anchor="middle">
        VIEW PROJECTS ↓
      </text>

      <!-- Say Hello button -->
      <rect x="150" y="0" width="94" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="197" y="21" fill="#f4f4ef" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="600" letter-spacing="1" text-anchor="middle">
        HELLO ↗
      </text>
    </g>

    <!-- Stats row (bottom) -->
    <line x1="0" y1="295" x2="900" y2="295" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Stat 1: UPTIME -->
    <text x="36" y="322" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.8">UPTIME</text>
    <text x="36" y="342" fill="#f4f4ef" font-family="'Clash Display',sans-serif" font-size="16" font-weight="600">
      17 <tspan fill="#63636b" font-size="10" font-family="'JetBrains Mono',monospace">YRS</tspan>
    </text>

    <!-- Stat 2: EXPERIMENTS -->
    <text x="180" y="322" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.8">EXPERIMENTS</text>
    <text x="180" y="342" fill="#f4f4ef" font-family="'Clash Display',sans-serif" font-size="16" font-weight="600">
      07 <tspan fill="#63636b" font-size="10" font-family="'JetBrains Mono',monospace">/ ∞</tspan>
    </text>

    <!-- Stat 3: COFFEE -->
    <text x="350" y="322" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.8">COFFEE</text>
    <text x="350" y="342" fill="#f4f4ef" font-family="'Clash Display',sans-serif" font-size="16" font-weight="600">
      INFINITE
    </text>

    <!-- Stat 4: STACK -->
    <text x="490" y="322" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.8">STACK</text>
    <text x="490" y="342" fill="#f4f4ef" font-family="'Clash Display',sans-serif" font-size="16" font-weight="600">
      PY · JS · UI
    </text>

    <!-- Stat 5: STATUS -->
    <text x="640" y="322" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1.8">STATUS</text>
    <text x="640" y="342" fill="#c8ff4d" font-family="'Clash Display',sans-serif" font-size="16" font-weight="600">
      BUILDING DAILY
    </text>

    <!-- Right watermark -->
    <text x="864" y="334" fill="#63636b" font-family="'JetBrains Mono',monospace" font-size="9.5" letter-spacing="1" text-anchor="end">
      aayushsrivastava.com ↗
    </text>
  </g>
</svg>
