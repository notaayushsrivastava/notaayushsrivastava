<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
  <defs>
    <linearGradient id="bg-bl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <radialGradient id="glow-bl" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(127,209,168,0.10)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="mesh-bl" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(127,209,168,0.04)" stroke-width="0.5"/>
    </pattern>
    <clipPath id="rounded-bl"><rect width="420" height="200" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#rounded-bl)">
    <rect width="420" height="200" fill="url(#bg-bl)"/>
    <rect width="420" height="200" fill="url(#mesh-bl)"/>
    <rect width="420" height="200" fill="url(#glow-bl)"/>
    <rect width="420" height="200" rx="14" fill="none" stroke="rgba(127,209,168,0.25)" stroke-width="1"/>

    <!-- Top row -->
    <text x="20" y="28" fill="#82828e" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="2">EXP-10 // APPLICATION SECURITY</text>
    
    <!-- Badge -->
    <rect x="302" y="13" width="100" height="22" rx="11" fill="#7fd1a8"/>
    <circle cx="314" cy="24" r="2.5" fill="#06130b"/>
    <text x="322" y="28" fill="#06130b" font-family="'Manrope',sans-serif" font-size="8" font-weight="800" letter-spacing="1.2">SEC ENGINEER</text>
    
    <!-- Title -->
    <text x="20" y="70" fill="#ffffff" font-family="monospace" font-size="24" font-weight="700" letter-spacing="1.5">BreachLabs</text>
    
    <!-- Subtitle -->
    <text x="20" y="92" fill="#7fd1a8" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="600" letter-spacing="1.5">BUILD. BREAK. VERIFY. FIX.</text>
    
    <!-- Description -->
    <text x="20" y="118" fill="#b8b8c2" font-family="'General Sans',sans-serif" font-size="12">An autonomous application-security engineer</text>
    <text x="20" y="134" fill="#b8b8c2" font-family="'General Sans',sans-serif" font-size="12">that inspects, tests, verifies, fixes, and retests software.</text>

    <!-- Tags -->
    <rect x="20" y="155" width="82" height="24" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
    <text x="31" y="171" fill="#82828e" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1">AI SECURITY</text>
    
    <rect x="112" y="155" width="42" height="24" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
    <text x="122" y="171" fill="#82828e" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1">MCP</text>

    <rect x="164" y="155" width="48" height="24" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
    <text x="174" y="171" fill="#82828e" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1">SAST</text>

    <rect x="222" y="155" width="48" height="24" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
    <text x="232" y="171" fill="#82828e" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1">DAST</text>

    <!-- Arrow -->
    <line x1="390" y1="22" x2="400" y2="12" stroke="rgba(255,255,255,0.3)" stroke-width="1.3"/>
    <polyline points="395,12 400,12 400,17" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.3"/>
  </g>
</svg>
